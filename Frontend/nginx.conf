# This image serves internal HTTP behind a trusted HTTPS ingress.
# Compose binds it to loopback by default; do not expose login traffic over public HTTP.
# Do not log query strings: payment return URLs contain provider payment keys.
log_format capsure '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_x_forwarded_proto $capsure_forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log capsure;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $capsure_backend http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $capsure_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/(auth|subscriptions|analysis|insurers|mydata|api)(/|$) {
        proxy_pass $capsure_backend$request_uri;
    }
    location ~ ^/dashboard/(home|summary|audits)(/|$) {
        proxy_pass $capsure_backend$request_uri;
    }
    location = /actuator/health { proxy_pass $capsure_backend$request_uri; }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control 'no-store';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
}
