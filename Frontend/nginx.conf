# 1. HTTP -> HTTPS 리다이렉트 및 Certbot 인증용 설정
server {
    listen 80;
    server_name j14a308.p.ssafy.io;

    # Certbot 인증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 서버 설정
server {
    listen 443 ssl;
    server_name j14a308.p.ssafy.io;

    # 인증서 경로 (Certbot 발급 후 생성됨)
    ssl_certificate /etc/letsencrypt/live/j14a308.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j14a308.p.ssafy.io/privkey.pem;

    # SSL 보안
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 에러 페이지 설정
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}