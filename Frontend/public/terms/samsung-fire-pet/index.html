<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>무배당 삼성화재 펫보험 의기냥냥(2601.2) 전체약관</title>
  <meta http-equiv="refresh" content="0; url=./full-terms-223.pdf" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #020715;
      --card: #0d1526;
      --line: #1f2a3d;
      --text: #e6edf7;
      --sub: #90a1bb;
      --accent: #82d8fc;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0%, #111f3a 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: min(760px, 100%);
      background: linear-gradient(180deg, rgba(13,21,38,0.95), rgba(6,12,24,0.95));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.35;
    }
    p {
      margin: 0;
      color: var(--sub);
      line-height: 1.6;
    }
    .docs {
      margin-top: 22px;
      display: grid;
      gap: 10px;
    }
    a {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 21, 38, 0.65);
      transition: all 0.2s ease;
    }
    a:hover {
      border-color: rgba(130, 216, 252, 0.6);
      background: rgba(24, 47, 72, 0.5);
      transform: translateY(-1px);
    }
    .label {
      font-weight: 700;
    }
    .badge {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>무배당 삼성화재 펫보험 의기냥냥(2601.2)</h1>
    <p>전체약관 PDF로 바로 이동합니다.</p>

    <section class="docs">
      <a href="./full-terms-223.pdf" target="_blank" rel="noopener noreferrer">
        <span class="label">전체약관</span>
        <span class="badge">PDF</span>
      </a>
    </section>
  </main>
</body>
</html>
