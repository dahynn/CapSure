services:
  frontend:
    # 도커 허브 이미지 경로 (latest 태그를 사용하여 최신 버전 유지)
    image: ${DOCKER_USER}/capsure-frontend:latest
    container_name: capsure-frontend-service
    ports:
      - "80:80" # 외부 80포트를 컨테이너 80포트(Nginx)로 연결
    restart: always
    environment:
      # 필요한 경우 런타임 환경변수 추가(현재 없음)
      - NODE_ENV=production

  # [Test] Frontend
  frontend-test:
    image: ${DOCKER_USER}/capsure-frontend:test
    container_name: capsure-frontend-test
    ports:
      - "8080:80" # 테스트용은 다른 포트(예: 8080)를 사용한다.
    restart: always
    environment:
      - NODE_ENV=development

      
