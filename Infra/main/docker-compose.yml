services:
  # [Production] Frontend
  frontend:
    image: ${DOCKER_USER}/capsure-frontend:latest
    container_name: capsure-frontend-prod
    ports:
      - "80:80"
    restart: always
    environment:
      - NODE_ENV=production

  # [Production] PostgreSQL
  postgres:
    image: postgres:17
    container_name: capsure-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capsure}
      POSTGRES_USER: ${POSTGRES_USER:-capsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Infra/main/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # [Production] Backend
  backend:
    image: ${DOCKER_USER}/capsure-backend:latest
    container_name: capsure-backend-prod
    ports:
      - "8000:8000"
    restart: always
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-capsure}
      - POSTGRES_USER=${POSTGRES_USER:-capsure}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  promtail:
    image: grafana/promtail:3.6.7
    container_name: main-promtail
    restart: always
    environment:
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:-}
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - ./promtail-data:/tmp/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent-net

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: main-node-exporter
    restart: always
    pid: host
    ports:
      - "8100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - agent-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.56.2
    container_name: main-cadvisor
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - agent-net

volumes:
  postgres_data:

networks:
  agent-net:
    driver: bridge
