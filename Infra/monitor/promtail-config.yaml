server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 시스템 로그
  - job_name: varlogs
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          server_type: monitor
          app: system
          __path__: /var/log/**/*.log
    pipeline_stages:
      # 불필요한 로그 drop
      - drop:
          expression: '(?i)\b(/healthz?|/ready|/readiness|/live|/liveness|heartbeat|\bpong\b|\bping\b)\b'
      - drop:
          expression: '(?i)\b(level=debug|level=trace|"level"\s*:\s*"(debug|trace)")\b'
      # 민감 정보 마스킹
      - replace:
          expression: '(?i)(authorization:\s*bearer\s+)[^\s"]+'
          replace: '${1}***'
      - replace:
          expression: '(?i)(token=)[^\s&"]+'
          replace: '${1}***'
      - replace:
          expression: '(?i)("password"\s*:\s*")[^"]+(")' 
          replace: '${1}***${2}'
      - replace:
          expression: '(?i)("secret"\s*:\s*")[^"]+(")' 
          replace: '${1}***${2}'

  # docker 컨테이너 로그
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["promtail.collect=true"]
    relabel_configs:
      - target_label: server_type
        replacement: monitor
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: app
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - drop:
          expression: '(?i)\b(/healthz?|/ready|/readiness|/live|/liveness|heartbeat|\bpong\b|\bping\b)\b'
      - drop:
          expression: '(?i)\b(level=debug|level=trace|"level"\s*:\s*"(debug|trace)")\b'
      - replace:
          expression: '(?i)(authorization:\s*bearer\s+)[^\s"]+'
          replace: '${1}***'
      - replace:
          expression: '(?i)(token=)[^\s&"]+'
          replace: '${1}***'
      - replace:
          expression: '(?i)("password"\s*:\s*")[^"]+(")' 
          replace: '${1}***${2}'
      - replace:
          expression: '(?i)("secret"\s*:\s*")[^"]+(")' 
          replace: '${1}***${2}'