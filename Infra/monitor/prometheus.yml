global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "monitoring-cluster"
    monitor: "mac-mini"

rule_files:
  - "alert-rules.yml"

# ─── scrape 설정 ─────────────────────────────────────────────────────
scrape_configs:

  # Prometheus 자체
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          server_type: "monitor"
          app: "prometheus"

  # Monitor 서버 (Mac Mini) - Node Exporter
  - job_name: "monitor-node-exporter"
    static_configs:
      - targets: ["monitor-node-exporter:9100"]
        labels:
          server_type: "monitor"
          app: "system"
    metric_relabel_configs: &filter_node_exporter
      - source_labels: [__name__]
        regex: "go_.*|promhttp_.*"
        action: drop
      - source_labels: [__name__]
        regex: "node_.*"
        action: keep

  # Monitor 서버 (Mac Mini) - cAdvisor
  - job_name: "monitor-cadvisor"
    static_configs:
      - targets: ["monitor-cadvisor:8080"]
        labels:
          server_type: "monitor"
          app: "docker"
    metric_relabel_configs: &filter_cadvisor
      - source_labels: [__name__]
        regex: "container_(cpu|memory|network|fs)_.*"
        action: keep

  # Main 서버 (EC2) - Node Exporter
  - job_name: "main-node-exporter"
    file_sd_configs:
      - files:
          - "/tmp/targets/main-node-exporter.json"
        refresh_interval: 30s  # 타겟 파일 변경 감지 주기
    metric_relabel_configs: *filter_node_exporter

  # Main 서버 (EC2) - cAdvisor
  - job_name: "main-cadvisor"
    file_sd_configs:
      - files:
          - "/tmp/targets/main-cadvisor.json"
        refresh_interval: 30s
    metric_relabel_configs: *filter_cadvisor

  # Mock 서버 (EC2) - Node Exporter
  - job_name: "mock-node-exporter"
    file_sd_configs:
      - files:
          - "/tmp/targets/mock-node-exporter.json"
        refresh_interval: 30s
    metric_relabel_configs: *filter_node_exporter

  # Mock 서버 (EC2) - cAdvisor
  - job_name: "mock-cadvisor"
    file_sd_configs:
      - files:
          - "/tmp/targets/mock-cadvisor.json"
        refresh_interval: 30s
    metric_relabel_configs: *filter_cadvisor
