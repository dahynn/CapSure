services:
  # [Production] Mock
  mock:
    image: ${DOCKER_USER}/mydata-mock:latest
    container_name: mydata-mock-prod
    ports:
      - "58000:8000"
    restart: always
    environment:
      - NODE_ENV=production

  # [Production] PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: mydata-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capsure}
      POSTGRES_USER: ${POSTGRES_USER:-capsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Infra/mock/.env}
    volumes:
      - capsule-postgres-data:/var/lib/postgresql/data
      - ${BACKEND_DIR:-../../Backend}/src/main/resources/db/schema/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ${BACKEND_DIR:-../../Backend}/src/main/resources/db/schema/product_source.sql:/docker-entrypoint-initdb.d/20-product_source.sql:ro
      - ${BACKEND_DIR:-../../Backend}/src/main/resources/db/seed/seed.sql:/docker-entrypoint-initdb.d/30-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:3.6.7
    container_name: mock-promtail
    restart: always
    environment:
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:-}
      LOKI_PORT: ${LOKI_PORT:-3100}
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - ./promtail-data:/tmp/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: mock-node-exporter
    restart: always
    pid: host
    ports:
      - "${MOCK_NODE_EXPORTER_PORT:-59100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: mock-cadvisor
    restart: always
    privileged: true
    ports:
      - "${MOCK_CADVISOR_PORT:-58080}:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  capsule-postgres-data:
