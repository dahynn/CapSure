spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${CAPSURE_POSTGRES_PORT:5433}/${CAPSURE_POSTGRES_DB:capsure}}
    username: ${DB_USERNAME:capsure}
    password: ${DB_PASSWORD:capsure}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

insurer:
  terms-pdf:
    path: ${INSURER_TERMS_PDF_PATH:classpath:terms/fixed-terms.pdf}
    max-chars: ${INSURER_TERMS_PDF_MAX_CHARS:30000}

copilot:
  claim-review:
    provider: ${CLAIM_REVIEW_COPILOT_PROVIDER:blocked}
    base-url: ${CLAIM_REVIEW_COPILOT_BASE_URL:}
    model: ${CLAIM_REVIEW_COPILOT_MODEL:}
    api-key: ${CLAIM_REVIEW_COPILOT_API_KEY:}
    timeout: ${CLAIM_REVIEW_COPILOT_TIMEOUT:10s}
    allow-external-calls: ${CLAIM_REVIEW_COPILOT_ALLOW_EXTERNAL_CALLS:false}

mydata:
  mock:
    base-url: ${MYDATA_MOCK_BASE_URL:http://localhost:8081}
    client-id: capsule-main-client
    provider-code: CAPSULE-MOCK
    timeout: 5s
    transmission-key-seed: capsule-main-transmission-seed
    token-secret: capsule-mydata-hs256-secret-key-32
    token-issuer: https://capsule-mydata-mock
    token-audience: capsule-main-client
    access-token-ttl: 10m
    refresh-token-ttl: 7d

payment:
  gateway: ${PAYMENT_GATEWAY:fake}
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
    timeout: ${TOSS_PAYMENTS_TIMEOUT:10s}
    allow-live-key: ${TOSS_PAYMENTS_ALLOW_LIVE_KEY:false}

# Audit retention is opt-in because the required legal/operational period depends on the deployment.
audit:
  retention:
    enabled: ${AUDIT_RETENTION_ENABLED:false}
    days: ${AUDIT_RETENTION_DAYS:365}
    cron: "${AUDIT_RETENTION_CRON:0 30 3 * * *}"
    zone: ${AUDIT_RETENTION_ZONE:Asia/Seoul}
