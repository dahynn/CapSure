spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: "here"
      base-url: ${OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: ${OPENAI_MODEL:gpt-5.2}
          temperature: 0.2
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${CAPSURE_POSTGRES_PORT:5433}/${CAPSURE_POSTGRES_DB:capsure}}
    username: ${DB_USERNAME:capsure}
    password: ${DB_PASSWORD:capsure}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

insurer:
  terms-pdf:
    path: ${INSURER_TERMS_PDF_PATH:classpath:terms/fixed-terms.pdf}
    max-chars: ${INSURER_TERMS_PDF_MAX_CHARS:30000}

mydata:
  mock:
    base-url: http://localhost:8081
    client-id: capsule-main-client
    provider-code: CAPSULE-MOCK
    timeout: 5s
    transmission-key-seed: capsule-main-transmission-seed
    token-secret: capsule-mydata-hs256-secret-key-32
    token-issuer: https://capsule-mydata-mock
    token-audience: capsule-main-client
    access-token-ttl: 10m
    refresh-token-ttl: 7d
